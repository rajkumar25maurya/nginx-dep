apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-frontend 
  namespace: argocd
spec:
  project: frontend-team

  source:
    repoURL: https://github.com/rajkumar25maurya/nginx-dep.git
    targetRevision: main
    path: .

  destination:
    server: https://192.168.1.140:6443 
    namespace: nginx-frontend

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true